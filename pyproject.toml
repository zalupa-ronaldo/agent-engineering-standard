[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-policy"
version = "0.1.0"
description = "Safe, machine-readable project policy and bootstrap CLI for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
license = { text = "MIT" }
authors = [{ name = "Agent Engineering Standard contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-policy = "agent_policy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_policy = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
