name: standard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m agent_policy validate
      - run: python -m agent_policy scan --json

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill structure
        run: |
          test -f skills/agent-engineering/SKILL.md
          test -f STANDARD.yaml
          test -f AGENTS.md
          python - <<'PY'
          import pathlib
          import re
          text = pathlib.Path("skills/agent-engineering/SKILL.md").read_text()
          assert re.search(r"^name:\s*agent-engineering\s*$", text, re.MULTILINE)
          assert re.search(r"^description:\s*.+$", text, re.MULTILINE)
          for path in pathlib.Path("skills/agent-engineering/references").glob("*.md"):
              assert path.read_text().strip(), path
          PY
